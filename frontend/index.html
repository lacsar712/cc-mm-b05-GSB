<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    .temp { color: #fcd34d; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .panel { background: #292524; border: 1px solid #57534e; padding: 10px 12px; margin-bottom: 14px; }
    .panel h3 { margin: 0 0 8px; font-size: 1em; }
    #raiseForm input { width: 90px; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>
      <div class="panel">
        <h3>报警线</h3>
        <p id="thresholdState">加载中…</p>
        <form id="raiseForm" hidden>
          临时抬到
          <input id="raiseValue" type="number" step="0.1" min="1.1" placeholder="1.5" />
          % ，
          <input id="raiseSeconds" type="number" step="1" min="1" placeholder="120" />
          秒后自动失效，回到 1%
          <button>抬高</button>
        </form>
        <p style="margin:8px 0 4px">抬线履历（只读）</p>
        <table>
          <thead><tr><th>临时线 %</th><th>设定时刻</th><th>失效时刻</th><th>设定人</th></tr></thead>
          <tbody id="raiseRows"></tbody>
        </table>
      </div>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>
      <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
